plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Release signing key, kept outside the project (see ~/orbit-keys/README.txt).
def keystoreProperties = new Properties()
def keystoreFile = file("${System.getProperty('user.home')}/orbit-keys/keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}

def tmdbProperties = new Properties()
def tmdbFile = rootProject.file("tmdb.properties")
if (tmdbFile.exists()) {
    tmdbFile.withInputStream { tmdbProperties.load(it) }
}

def traktProperties = new Properties()
def traktFile = rootProject.file("trakt.properties")
if (traktFile.exists()) {
    traktFile.withInputStream { traktProperties.load(it) }
}

android {
    lint {
        // Media3's "unstable" APIs are used on purpose (NuvioTV disables this check too).
        disable "UnsafeOptInUsageError"
    }

    buildFeatures {
        buildConfig true
    }
    namespace "com.orbit.player"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TV sticks and boxes are ARM; leaving out x86 keeps the native decoders' size down.
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        applicationId "com.orbit.player"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.2"
        manifestPlaceholders = [appLabel: "Orbit"]
        buildConfigField "String", "TMDB_API_KEY", "\"${tmdbProperties.getProperty('TMDB_API_KEY', '')}\""
        buildConfigField "String", "TRAKT_CLIENT_ID", "\"${traktProperties.getProperty('TRAKT_CLIENT_ID', '')}\""
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Smaller and faster on the stick: unused code removed and the rest optimised.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
        debug {
            // Test builds install alongside the real Orbit instead of replacing it.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [appLabel: "Orbit (test)"]
        }
    }
}

// NuvioTV's build of Media3 1.8.0 (app/libs, from NuvioMedia/NuvioTV) replaces these stock modules.
configurations.all {
    exclude group: "androidx.media3", module: "media3-exoplayer"
    exclude group: "androidx.media3", module: "media3-common"
    exclude group: "androidx.media3", module: "media3-datasource"
    exclude group: "androidx.media3", module: "media3-datasource-okhttp"
    exclude group: "androidx.media3", module: "media3-exoplayer-hls"
    exclude group: "androidx.media3", module: "media3-extractor"
}

dependencies {
    implementation files(
        "libs/lib-common-release.aar",
        "libs/lib-datasource-release.aar",
        "libs/lib-datasource-okhttp-release.aar",
        "libs/lib-exoplayer-release.aar",
        "libs/lib-exoplayer-hls-release.aar",
        "libs/lib-extractor-release.aar",
        // Extra decoders: FFmpeg audio (DTS, TrueHD, E-AC3, …), AV1, MPEG-H.
        "libs/lib-decoder-ffmpeg-release.aar",
        "libs/lib-decoder-av1-release.aar",
        "libs/lib-decoder-mpegh-release.aar"
    )
    implementation "androidx.media3:media3-ui:1.8.0"
    implementation "androidx.media3:media3-decoder:1.8.0"
    implementation "androidx.media3:media3-container:1.8.0"
    implementation "androidx.media3:media3-database:1.8.0"
    implementation "com.google.guava:guava:33.3.1-android"
    implementation "androidx.annotation:annotation-experimental:1.3.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.0"
    implementation "com.google.zxing:core:3.5.3"
}
