plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Release signing key, kept outside the project (see ~/orbit-keys/README.txt).
def keystoreProperties = new Properties()
def keystoreFile = file("${System.getProperty('user.home')}/orbit-keys/keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}

def tmdbProperties = new Properties()
def tmdbFile = rootProject.file("tmdb.properties")
if (tmdbFile.exists()) {
    tmdbFile.withInputStream { tmdbProperties.load(it) }
}

android {
    buildFeatures {
        buildConfig true
    }
    namespace "com.orbit.player"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.orbit.player"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.1"
        manifestPlaceholders = [appLabel: "Orbit"]
        buildConfigField "String", "TMDB_API_KEY", "\"${tmdbProperties.getProperty('TMDB_API_KEY', '')}\""
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Smaller and faster on the stick: unused code removed and the rest optimised.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
        debug {
            // Test builds install alongside the real Orbit instead of replacing it.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [appLabel: "Orbit (test)"]
        }
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    implementation "androidx.recyclerview:recyclerview:1.3.0"
    implementation "com.google.zxing:core:3.5.3"
}
